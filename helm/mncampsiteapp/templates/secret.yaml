{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mncampsiteapp.secretName" . }}
  labels:
    {{- include "mncampsiteapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET_KEY: {{ .Values.secrets.SESSION_SECRET_KEY | quote }}
  GOOGLE_SHEETS_API_KEY: {{ .Values.secrets.GOOGLE_SHEETS_API_KEY | quote }}
  GOOGLE_MAPS_API_KEY: {{ .Values.secrets.GOOGLE_MAPS_API_KEY | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.GOOGLE_CLIENT_ID | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.GOOGLE_CLIENT_SECRET | quote }}
{{- end }}
